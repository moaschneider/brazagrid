<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrazaGrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0f2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
            padding: 0 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 42px;
            font-weight: bold;
        }

        .flag-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #009739 0%, #FEDD00 50%, #012169 100%);
            border-radius: 4px;
            display: inline-block;
        }

        .header-icons {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-info {
            text-align: center;
            margin: 0 auto 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            width: 605px;
            max-width: 100%;
            box-sizing: border-box;
        }


        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 140px);
            gap: 8px;
            margin: 0 auto 30px;
            justify-content: center;
        }

        .grid-cell {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            aspect-ratio: 1;
            width: 140px;
            height: 140px;
            max-width: 140px;
            max-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-sizing: border-box;
            word-break: normal;
            overflow-wrap: normal;
            hyphens: none;
        }

        .grid-cell.header-cell {
            background: rgba(255, 255, 255, 0.03);
            cursor: default;
        }

        .grid-cell.characteristic-cell {
            background: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            line-height: 1.3;
            font-weight: 500;
            word-break: normal;
            overflow-wrap: normal;
            hyphens: none;
        }

        .grid-cell.answer-cell {
            cursor: pointer;
            position: relative;
        }

        .grid-cell.answer-cell:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .grid-cell.answer-cell.correct {
            background: rgba(0, 200, 0, 0.2);
            border-color: #4ade80;
        }

        .grid-cell.answer-cell.incorrect {
            background: rgba(200, 0, 0, 0.2);
            border-color: #f87171;
        }

        .grid-cell.answer-cell.filled {
            font-weight: bold;
            font-size: 16px;
        }

        /* Modal/Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0f2e 100%);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #FEDD00;
            font-size: 20px;
        }

        .modal .characteristics {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .modal .characteristics p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .modal .characteristics .label {
            color: #FEDD00;
            font-weight: bold;
        }

        .modal .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
        }

        .modal input:focus {
            outline: none;
            border-color: #FEDD00;
        }

        .modal input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .modal .buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            background: #FEDD00;
            color: #1a0f2e;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffed4a;
            transform: scale(1.05);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .modal .message.show {
            display: block;
        }

        .modal .message.success {
            background: rgba(0, 200, 0, 0.2);
            color: #4ade80;
        }

        .modal .message.error {
            background: rgba(200, 0, 0, 0.2);
            color: #f87171;
        }

        /* Media query para telas entre 420px e 600px */
        @media (max-width: 600px) and (min-width: 421px) {
            body {
                padding: 15px;
            }

            .game-info {
                width: 100% !important;
                max-width: 100% !important;
                padding: 12px;
            }

            .grid-container {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 6px !important;
                max-width: 100%;
                width: 100%;
            }

            .grid-cell {
                width: 100% !important;
                height: auto !important;
                max-width: 100% !important;
                max-height: 100% !important;
                aspect-ratio: 1;
                padding: 12px;
                font-size: 11px;
            }

            .grid-cell.characteristic-cell {
                font-size: 10px;
                line-height: 1.3;
                word-break: normal;
                overflow-wrap: normal;
                hyphens: none;
            }

            .grid-cell.answer-cell.filled {
                font-size: 13px;
            }
        }

        /* Media query para telas de 420px */
        @media (max-width: 420px) {
            body {
                padding: 10px;
            }

            .game-container {
                max-width: 100%;
            }

            .game-info {
                width: 100% !important;
                max-width: 100% !important;
                padding: 12px;
            }

            .grid-container {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 5px !important;
                max-width: 100%;
                width: 100%;
            }

            .grid-cell {
                width: 100% !important;
                height: auto !important;
                max-width: 100% !important;
                max-height: 100% !important;
                aspect-ratio: 1;
                padding: 8px;
                font-size: 10px;
            }

            .grid-cell.characteristic-cell {
                font-size: 9px;
                line-height: 1.2;
                word-break: normal;
                overflow-wrap: normal;
                hyphens: none;
            }

            .grid-cell.answer-cell.filled {
                font-size: 12px;
            }

            .logo {
                font-size: 24px;
            }

            .flag-icon {
                width: 22px;
                height: 22px;
            }

            .header {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="flag-icon"></div>
            <span>BrazaGrid</span>
        </div>
    </div>

    <div class="game-container">
        <div class="game-info">
            <div id="guessesCounter" style="font-size: 16px; font-weight: bold; color: #FEDD00;">Palpites: 0/12</div>
        </div>

        <div class="grid-container" id="grid"></div>
    </div>

    <!-- Modal para entrada de estado -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="modalTitle">Digite o Estado</h3>
            <div class="input-container">
                <input type="text" id="stateInput" placeholder="Ex: Rio Grande do Sul ou RS" autocomplete="off">
                <button onclick="submitAnswer()">Confirmar</button>
            </div>
            <div class="message" id="modalMessage"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
